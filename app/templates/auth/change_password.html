{% extends 'shared/base.html' %}
{% block title %}Change Password — GRPMS{% endblock %}

{% block sidebar %}
<a href="{{ url_for('auth.dashboard_router') }}"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
{% endblock %}

{% block bottom_nav %}
<a href="{{ url_for('auth.dashboard_router') }}" class="active"><i class="fas fa-arrow-left"></i><span>Back</span></a>
{% endblock %}

{% block content %}
<div style="max-width:480px; margin:0 auto;">
  <div class="g6-page-header">
    <div class="g6-eyebrow">Account Security</div>
    <h2 class="g6-page-title"><i class="fas fa-lock"></i> Change Password</h2>
  </div>

  <div class="g6-card">
    <form method="POST" action="{{ url_for('auth.change_password') }}">
      <div style="margin-bottom:1rem;">
        <label class="g6-label" for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" class="g6-input" required>
      </div>

      <div style="margin-bottom:1rem;">
        <label class="g6-label" for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="g6-input" minlength="6" required>
      </div>

      <div style="margin-bottom:1.5rem;">
        <label class="g6-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="g6-input" minlength="6" required>
      </div>

      <button type="submit" class="g6-btn g6-btn-primary g6-btn-block">
        <i class="fas fa-check"></i> Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
