{% extends 'shared/base.html' %}
{% block title %}Login — GRPMS{% endblock %}

{% block guest_content %}
<div style="min-height: 70vh; display:flex; align-items:center; justify-content:center; padding: 1rem;">
  <div style="width:100%; max-width:420px; background:var(--white); border-radius:var(--radius-lg);
              box-shadow:var(--shadow-card); border:1px solid var(--slate-200); overflow:hidden;">

    <div style="text-align:center; padding: 2.5rem 1.5rem 1.5rem;">
      <div style="width:64px; height:64px; background:var(--blue-50); color:var(--blue-600);
                  border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
                  font-size:1.6rem; margin-bottom:1rem;">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1 class="g6-heading" style="font-size:1.3rem; margin-bottom:0.25rem;">GRPMS</h1>
      <p class="g6-muted g6-text-sm" style="margin:0;">Grade &amp; Result Processing &amp; Management System</p>
    </div>

    <div style="padding: 0 1.5rem 2rem;">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div style="margin-bottom: 1rem;">
          <label class="g6-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="g6-input" placeholder="Enter your username" required autofocus>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="g6-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="g6-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="g6-btn g6-btn-primary g6-btn-block">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>
    </div>

    <div style="text-align:center; padding: 1rem 1.5rem; background:var(--slate-50); border-top:1px solid var(--slate-200);">
      <span class="g6-text-sm g6-muted"><i class="fas fa-info-circle"></i> Forgot your login? Ask your school administrator.</span>
    </div>
  </div>
</div>
{% endblock %}
