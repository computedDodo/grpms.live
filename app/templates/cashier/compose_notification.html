{% extends 'cashier/base_cashier.html' %}
{% block title %}Contact SuperAdmin — Cashier{% endblock %}

{% block content %}
<div class="g6-page-header">
  <div class="g6-eyebrow">Communications</div>
  <h2 class="g6-page-title"><i class="fas fa-paper-plane"></i> Contact SuperAdmin</h2>
</div>

<div class="g6-card" style="max-width:560px;">
  <p class="g6-text-sm g6-muted" style="margin-bottom:1.25rem;">
    Use this to send feedback, complaints, or requests directly to your school's SuperAdmin.
  </p>
  <form method="POST" action="{{ url_for('cashier.compose_notification') }}">
    <input type="hidden" name="recipient_type" value="superadmin">

    <div style="margin-bottom:1rem;">
      <label class="g6-label">Subject <span style="color:var(--danger)">*</span></label>
      <input type="text" name="subject" class="g6-input"
             placeholder="e.g. Missing coupon codes for JSS 2" required>
    </div>

    <div style="margin-bottom:1.25rem;">
      <label class="g6-label">Message <span style="color:var(--danger)">*</span></label>
      <textarea name="body" class="g6-input g6-textarea" rows="6"
                placeholder="Describe your issue or request..." required></textarea>
    </div>

    <div style="display:flex; gap:0.75rem;">
      <button type="submit" class="g6-btn g6-btn-primary" style="flex:1;">
        <i class="fas fa-paper-plane"></i> Send to SuperAdmin
      </button>
      <a href="{{ url_for('cashier.notifications') }}" class="g6-btn g6-btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
